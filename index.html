<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Served from public/, so these paths survive the build — the old
         ./src/assets/ href only resolved under the dev server. -->
    <link rel="icon" type="image/svg+xml" href="/person.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Still one stylesheet request for the whole page — the four
         families are asked for in a single css2 URL. Newsreader is the
         body serif; Syne / Inter / Fira Code are the hero's display,
         micro-copy and code faces. Weights are pinned tight on the
         three additions so this stays cheap. See docs/FONTS.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Scroll reveals start from opacity:0, so without JS the page
         would render blank. Pin everything to its final state. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <title>Raghuveer Sharma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
