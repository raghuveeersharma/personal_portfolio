<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO / metadata ───────────────────────────────────── -->
    <title>Raghuveer Sharma — Full-Stack MERN Developer</title>
    <meta
      name="description"
      content="Raghuveer Sharma — full-stack MERN developer based in India. I design and build responsive web applications with MongoDB, Express, React, and Node.js. Explore my projects, skills, and experience."
    />
    <meta name="author" content="Raghuveer Sharma" />
    <meta
      name="keywords"
      content="Raghuveer Sharma, MERN developer, full-stack developer, React, Node.js, Express, MongoDB, web developer portfolio, India"
    />

    <!-- Served from public/, so these paths survive the build — the old
         ./src/assets/ href only resolved under the dev server. -->
    <link rel="icon" type="image/svg+xml" href="/person.svg" />
    <link rel="canonical" href="https://raghuveersharma.vercel.app/" />
    <meta name="theme-color" content="#050414" />
    <meta name="color-scheme" content="dark" />

    <!-- ── Open Graph ────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://raghuveersharma.vercel.app/" />
    <meta property="og:title" content="Raghuveer Sharma — Full-Stack MERN Developer" />
    <meta
      property="og:description"
      content="Full-stack MERN developer from India building responsive, production-grade web applications. Explore projects, skills, and experience."
    />
    <meta property="og:image" content="https://raghuveersharma.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Raghuveer Sharma — Full-Stack MERN Developer portfolio card" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Raghuveer Sharma" />

    <!-- ── Twitter Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raghuveer Sharma — Full-Stack MERN Developer" />
    <meta
      name="twitter:description"
      content="Full-stack MERN developer from India building responsive, production-grade web applications."
    />
    <meta name="twitter:image" content="https://raghuveersharma.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Raghuveer Sharma — Full-Stack MERN Developer portfolio card" />

    <!-- ── JSON-LD: Person ───────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Raghuveer Sharma",
        "url": "https://raghuveersharma.vercel.app/",
        "image": "https://raghuveersharma.vercel.app/og-image.png",
        "jobTitle": "Full-Stack MERN Developer",
        "description": "Full-stack MERN developer based in India, building responsive web applications with MongoDB, Express, React, and Node.js.",
        "sameAs": [
          "https://github.com/raghuveeersharma",
          "https://www.linkedin.com/in/raghuveer-sharma-810124252/",
          "https://leetcode.com/u/RaghuSharma48/"
        ],
        "knowsAbout": [
          "JavaScript", "TypeScript", "React", "Next.js",
          "Node.js", "Express.js", "MongoDB", "PostgreSQL",
          "Tailwind CSS", "REST APIs", "Git"
        ]
      }
    </script>

    <!-- ── Fonts ─────────────────────────────────────────────── -->
    <!-- Still one stylesheet request for the whole page — the four
         families are asked for in a single css2 URL. Newsreader is the
         body serif; Syne / Inter / Fira Code are the hero's display,
         micro-copy and code faces. Weights are pinned tight on the
         three additions so this stays cheap. See docs/FONTS.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Scroll reveals start from opacity:0, so without JS the page
         would render blank. Pin everything to its final state. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
